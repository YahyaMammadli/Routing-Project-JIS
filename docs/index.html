<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routing Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Route Calculator</h1>
            <p class="subtitle">Compare routes from 2GIS and Yandex</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="from">From</label>
                <input id="from" type="text" placeholder="e.g. Koroğlu, Bakı" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="to">To</label>
                <input id="to" type="text" placeholder="e.g. Elmlər Akademiyası, Bakı" autocomplete="off">
            </div>

            <button id="calculateBtn" onclick="calculateRoute()">
                <span class="btn-label">Calculate route</span>
            </button>
        </div>

        <div id="result" class="result-card"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
